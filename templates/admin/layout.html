<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin - Gol a Gol{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <script defer src="https://use.fontawesome.com/releases/v6.5.1/js/all.js"></script>
</head>
<body class="admin-body">
    <nav class="navbar is-dark" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="/admin">
                <span class="icon-text">
                    <span class="icon">
                        <i class="fas fa-futbol"></i>
                    </span>
                    <span><strong>Admin Gol a Gol</strong></span>
                </span>
            </a>

            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="adminNavbar">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>

        <div id="adminNavbar" class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="/admin">
                    <span class="icon">
                        <i class="fas fa-chart-line"></i>
                    </span>
                    <span>Dashboard</span>
                </a>

                <a class="navbar-item" href="/admin/equipos">
                    <span class="icon">
                        <i class="fas fa-shield-alt"></i>
                    </span>
                    <span>Equipos</span>
                </a>

                <a class="navbar-item" href="/admin/jugadores">
                    <span class="icon">
                        <i class="fas fa-users"></i>
                    </span>
                    <span>Jugadores</span>
                </a>

                <div class="navbar-item has-dropdown is-hoverable">
                    <a class="navbar-link">
                        <span class="icon">
                            <i class="fas fa-calendar-alt"></i>
                        </span>
                        <span>Partidos</span>
                    </a>

                    <div class="navbar-dropdown">
                        <a class="navbar-item" href="/admin/partidos">
                            <span class="icon">
                                <i class="fas fa-list"></i>
                            </span>
                            <span>Gestionar Partidos</span>
                        </a>
                        <a class="navbar-item" href="/admin/formaciones">
                            <span class="icon">
                                <i class="fas fa-chess-board"></i>
                            </span>
                            <span>Formaciones</span>
                        </a>
                        <a class="navbar-item" href="/admin/eventos">
                            <span class="icon">
                                <i class="fas fa-bell"></i>
                            </span>
                            <span>Eventos</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="navbar-end">
                <div class="navbar-item">
                    <div class="buttons">
                        <a class="button is-light" href="/">
                            <span class="icon">
                                <i class="fas fa-eye"></i>
                            </span>
                            <span>Ver Sitio</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="admin-main section">
        <div class="container is-fluid">
            {% block content %}{% endblock %}
        </div>
    </main>
    
    <script src="/static/js/admin.js"></script>
    <script>
        // Burger menu toggle
        document.addEventListener('DOMContentLoaded', () => {
            const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
            
            $navbarBurgers.forEach( el => {
                el.addEventListener('click', () => {
                    const target = el.dataset.target;
                    const $target = document.getElementById(target);
                    el.classList.toggle('is-active');
                    $target.classList.toggle('is-active');
                });
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
